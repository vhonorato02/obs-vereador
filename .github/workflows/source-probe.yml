# Checks whether GitHub-hosted runners can reach the official data sources.
# Research aid for the ingestion design: two polite requests per source, no secrets.
name: source-probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/source-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner egress
        run: curl -sS -m 15 https://ipinfo.io/json | grep -E '"(ip|city|country|org)"' || true
      - name: Reach official sources
        run: |
          UA="AcompanheSeuVereador-probe/0.1 (+https://github.com/${GITHUB_REPOSITORY})"
          for url in \
            "https://www.pindamonhangaba.sp.leg.br/" \
            "https://www.pindamonhangaba.sp.leg.br/jsonweb/web-rss.php" \
            "https://siapegov.pindamonhangaba.sp.gov.br/portal-transparencia/api/sis_entidade" \
            "https://transparencia.tce.sp.gov.br/api/json/municipios"; do
            sleep 5
            out=$(curl -sS -m 25 -A "$UA" -o body.tmp -w '%{http_code} %{time_total}s %{size_download}B' "$url" 2>&1) || true
            bot=$(grep -c 'Bot Verification' body.tmp 2>/dev/null || echo 0)
            echo "$url -> $out bot_check=$bot"
          done
